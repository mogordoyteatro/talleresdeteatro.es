<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cuestionario de Teatro · Talleres de Teatro Barcelona</title>
  <meta name="description" content="Elige un tema y pon a prueba lo que sabes sobre el entrenamiento actoral. Nueve bloques temáticos sobre actuación, cuerpo, improvisación y presencia escénica." />
  <meta name="robots" content="index, follow" />
  <link rel="canonical" href="https://talleresdeteatro.es/cuestionario/" />
  <meta property="og:title" content="Cuestionario de Teatro · Talleres de Teatro Barcelona" />
  <meta property="og:description" content="Nueve temas. Cuatro preguntas cada uno. Actuación, cuerpo, improvisación y presencia escénica." />
  <meta property="og:url" content="https://talleresdeteatro.es/cuestionario/" />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:ital,wght@0,300;0,400;0,500;1,300&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:            #0C0C0C;
      --surface:       #161616;
      --surface-hover: #1E1E1E;
      --border:        #2A2A2A;
      --border-hover:  #444;
      --red:           #E50914;
      --white:         #FFFFFF;
      --gray:          #888888;
      --gray-light:    #CCCCCC;
      --font-display:  'Archivo Black', sans-serif;
      --font-body:     'Inter', sans-serif;
      --max-w:         1200px;
      --quiz-w:        660px;
      --ease:          cubic-bezier(0.4, 0, 0.2, 1);
      --pad-x:         clamp(20px, 5vw, 72px);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--white);
      font-family: var(--font-body);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }
    button { cursor: pointer; border: none; background: none; font-family: inherit; color: inherit; }
    a { text-decoration: none; color: inherit; }
    img { display: block; }

    /* ── PROGRESS LINE ── */
    #progress-line {
      position: fixed;
      top: 0; left: 0;
      height: 2px;
      width: 0%;
      background: var(--red);
      transition: width 0.6s var(--ease);
      z-index: 300;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      padding: 1rem var(--pad-x);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 200;
      background: rgba(12,12,12,0.96);
      border-bottom: 1px solid var(--border);
    }
    .nav-logo {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      line-height: 1;
    }
    .nav-logo span { color: var(--red); }
    .nav-back {
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--gray);
      transition: color 0.2s ease;
    }
    .nav-back:hover { color: var(--white); }

    /* ── SCREENS ── */
    .screen {
      display: none;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s var(--ease), transform 0.45s var(--ease);
    }
    .screen.visible { opacity: 1; transform: translateY(0); }

    /* ════════════════════════════════
       ① LANDING
    ════════════════════════════════ */
    #landing-screen {
      min-height: 100vh;
      flex-direction: column;
      padding-top: 57px;
    }

    .landing-header {
      padding: clamp(48px, 8vw, 96px) var(--pad-x) clamp(32px, 5vw, 56px);
      border-bottom: 1px solid var(--border);
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
    }
    .landing-eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--red);
      display: block;
      margin-bottom: 1.25rem;
    }
    .landing-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 7rem);
      text-transform: uppercase;
      letter-spacing: -0.01em;
      line-height: 0.9;
      margin-bottom: 1.5rem;
    }
    .landing-title em { font-style: normal; color: var(--red); }
    .landing-meta {
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .landing-desc {
      font-size: 0.9rem;
      font-weight: 300;
      color: var(--gray-light);
      letter-spacing: 0.01em;
    }
    .landing-count {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .landing-count strong {
      font-family: var(--font-display);
      font-size: 0.85rem;
      letter-spacing: 0;
      color: var(--white);
    }

    /* ── THEME GRID ── */
    .themes-section {
      padding: clamp(24px, 4vw, 48px) var(--pad-x) clamp(40px, 6vw, 80px);
      max-width: var(--max-w);
      width: 100%;
      margin: 0 auto;
      flex: 1;
    }
    .themes-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
    }
    @media (max-width: 900px)  { .themes-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 500px)  { .themes-grid { grid-template-columns: 1fr; } }

    .theme-card {
      position: relative;
      aspect-ratio: 4/3;
      overflow: hidden;
      cursor: pointer;
      display: block;
    }
    .theme-card-img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center;
      transition: transform 0.55s var(--ease);
    }
    .theme-card:hover .theme-card-img { transform: scale(1.06); }
    .theme-card-overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,
        rgba(12,12,12,0.95) 0%,
        rgba(12,12,12,0.5)  45%,
        rgba(12,12,12,0.15) 100%
      );
      transition: background 0.3s ease;
    }
    .theme-card:hover .theme-card-overlay {
      background: linear-gradient(to top,
        rgba(12,12,12,0.97) 0%,
        rgba(12,12,12,0.65) 55%,
        rgba(12,12,12,0.28) 100%
      );
    }
    .theme-card-content {
      position: absolute;
      inset: 0;
      padding: 1.1rem 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .theme-card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }
    .theme-num {
      font-family: var(--font-display);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: rgba(255,255,255,0.38);
    }
    .theme-badge {
      font-size: 0.58rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--red);
      background: rgba(229,9,20,0.1);
      border: 1px solid rgba(229,9,20,0.28);
      padding: 0.22rem 0.45rem;
    }
    .theme-card-title {
      font-family: var(--font-display);
      font-size: clamp(0.95rem, 2vw, 1.15rem);
      text-transform: uppercase;
      letter-spacing: 0.02em;
      line-height: 1.15;
      margin-bottom: 0.5rem;
    }
    .theme-card-sub {
      font-size: 0.72rem;
      font-weight: 300;
      color: rgba(255,255,255,0.5);
      line-height: 1.45;
    }
    .theme-card-arrow {
      display: inline-block;
      margin-top: 0.75rem;
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--red);
      transition: letter-spacing 0.3s ease;
    }
    .theme-card:hover .theme-card-arrow { letter-spacing: 0.22em; }

    /* ════════════════════════════════
       ② QUIZ
    ════════════════════════════════ */
    #quiz-screen {
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 7rem 1.5rem 3rem;
    }

    .quiz-theme-bar {
      position: fixed;
      top: 57px; left: 0; right: 0;
      padding: 0.55rem var(--pad-x);
      display: flex;
      align-items: center;
      gap: 1rem;
      z-index: 150;
      background: rgba(12,12,12,0.94);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
    }
    .quiz-back-btn {
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gray);
      transition: color 0.2s ease;
      padding: 0;
    }
    .quiz-back-btn:hover { color: var(--white); }
    .quiz-divider { width: 1px; height: 12px; background: var(--border-hover); }
    .quiz-theme-name {
      font-size: 0.62rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--white);
    }

    .q-inner {
      max-width: var(--quiz-w);
      width: 100%;
      transition: opacity 0.22s ease, transform 0.22s ease;
    }
    .q-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 2.5rem;
    }
    .q-counter {
      font-size: 0.65rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
    }
    .q-counter strong {
      font-family: var(--font-display);
      font-size: 1rem;
      letter-spacing: 0;
      color: var(--white);
    }
    .q-dots { display: flex; gap: 5px; }
    .q-dot {
      height: 2px; width: 20px;
      background: var(--border);
      transition: background 0.4s ease, width 0.3s ease;
    }
    .q-dot.done    { background: var(--red); }
    .q-dot.current { background: var(--gray); width: 30px; }

    .q-tag {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--gray);
      margin-bottom: 1rem;
    }
    .q-tag::before { content: '→ '; color: var(--red); }

    .q-text {
      font-family: var(--font-display);
      font-size: clamp(1.15rem, 3vw, 1.6rem);
      line-height: 1.35;
      text-transform: uppercase;
      letter-spacing: 0.01em;
      margin-bottom: 2.25rem;
      font-weight: 400;
    }

    /* options */
    .options { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1.5rem; }
    .option {
      display: flex;
      align-items: flex-start;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: border-color 0.2s ease, background 0.2s ease, opacity 0.3s ease;
      opacity: 0;
      transform: translateY(5px);
      animation: optIn 0.35s var(--ease) forwards;
    }
    .option:nth-child(1) { animation-delay: 0.06s; }
    .option:nth-child(2) { animation-delay: 0.14s; }
    .option:nth-child(3) { animation-delay: 0.22s; }
    .option:nth-child(4) { animation-delay: 0.30s; }
    @keyframes optIn { to { opacity: 1; transform: translateY(0); } }

    .option:hover:not(.disabled) { border-color: var(--border-hover); background: var(--surface-hover); }
    .option.disabled { cursor: default; }
    .option.correct  { border-color: var(--white); background: rgba(255,255,255,0.04); }
    .option.wrong    { border-color: var(--border); opacity: 0.35; }
    .option.reveal   { border-color: var(--white); background: rgba(255,255,255,0.04); }

    .opt-letter {
      font-family: var(--font-display);
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: var(--gray);
      min-width: 1.1rem;
      padding-top: 3px;
      transition: color 0.2s ease;
    }
    .option.correct .opt-letter,
    .option.reveal  .opt-letter { color: var(--red); }

    .opt-text {
      font-size: 0.875rem;
      font-weight: 400;
      line-height: 1.58;
      color: var(--gray-light);
      flex: 1;
      transition: color 0.2s ease;
    }
    .option.correct .opt-text,
    .option.reveal  .opt-text { color: var(--white); }

    .opt-icon {
      font-size: 0.8rem;
      min-width: 1rem;
      padding-top: 3px;
      opacity: 0;
      transition: opacity 0.3s ease;
    }
    .option.correct .opt-icon { opacity: 1; color: var(--white); }
    .option.wrong   .opt-icon { opacity: 1; color: var(--gray); }

    /* hint */
    .hint-row { margin-bottom: 0.5rem; }
    .hint-btn {
      font-size: 0.62rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--red);
      padding: 0;
      transition: opacity 0.2s ease;
    }
    .hint-btn:hover { opacity: 0.65; }
    .hint-box {
      display: none;
      margin-top: 0.8rem;
      padding: 0.85rem 1.1rem;
      border-left: 2px solid var(--red);
      font-size: 0.82rem;
      font-weight: 300;
      font-style: italic;
      color: var(--gray-light);
      line-height: 1.65;
      animation: fadeSlide 0.3s ease;
    }
    .hint-box.open { display: block; }

    /* feedback */
    .feedback-box {
      display: none;
      margin-top: 1.1rem;
      padding: 1.1rem 1.2rem;
      background: var(--surface);
      border-left: 2px solid var(--border-hover);
      animation: fadeSlide 0.4s ease;
    }
    .feedback-box.open { display: block; }
    .feedback-label {
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      margin-bottom: 0.45rem;
    }
    .feedback-label.wrong-lbl { color: var(--gray); }
    .feedback-text {
      font-size: 0.84rem;
      font-weight: 300;
      color: var(--gray-light);
      line-height: 1.68;
    }

    /* next btn */
    .btn-next {
      font-family: var(--font-display);
      font-size: 0.74rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--white);
      border: 1px solid var(--border-hover);
      padding: 0.9rem 2rem;
      margin-top: 1.5rem;
      display: none;
      opacity: 0;
      transition: border-color 0.2s ease, background 0.2s ease, opacity 0.3s ease;
    }
    .btn-next.show    { display: inline-block; }
    .btn-next.visible { opacity: 1; }
    .btn-next:hover { border-color: var(--white); background: rgba(255,255,255,0.04); }

    .kbd-hint {
      margin-top: 2rem;
      font-size: 0.6rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--border-hover);
      text-align: center;
      animation: fadeIn 1s ease 1.2s both;
    }
    @media (pointer: coarse) { .kbd-hint { display: none; } }

    /* ════════════════════════════════
       ③ RESULT
    ════════════════════════════════ */
    #result-screen {
      min-height: 100vh;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6rem 1.5rem 3rem;
    }
    .result-inner {
      max-width: 540px;
      width: 100%;
      text-align: center;
    }
    .result-tema-label {
      font-size: 0.62rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--red);
      display: block;
      margin-bottom: 2rem;
    }
    .score-block { line-height: 1; margin-bottom: 0.5rem; }
    .score-num {
      font-family: var(--font-display);
      font-size: clamp(5.5rem, 20vw, 9rem);
      color: var(--white);
    }
    .score-denom {
      font-family: var(--font-display);
      font-size: clamp(1.8rem, 6vw, 3rem);
      color: var(--gray);
    }
    .score-bar {
      width: 100%; height: 2px;
      background: var(--border);
      margin: 1.5rem 0 2rem;
      overflow: hidden;
    }
    .score-bar-fill {
      height: 100%;
      background: var(--red);
      width: 0%;
      transition: width 1s var(--ease) 0.3s;
    }
    .result-phrase {
      font-size: clamp(0.95rem, 2.2vw, 1.15rem);
      font-weight: 300;
      font-style: italic;
      color: var(--gray-light);
      line-height: 1.65;
      margin-bottom: 2.5rem;
    }
    .result-actions {
      display: flex;
      gap: 0.8rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn-primary {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--white);
      background: var(--red);
      padding: 0.9rem 1.8rem;
      display: inline-block;
      transition: background 0.2s ease;
    }
    .btn-primary:hover { background: #c5000f; }
    .btn-secondary {
      font-family: var(--font-display);
      font-size: 0.72rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--gray);
      border: 1px solid var(--border);
      padding: 0.9rem 1.8rem;
      display: inline-block;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .btn-secondary:hover { color: var(--white); border-color: var(--gray); }

    /* ── ANIMATIONS ── */
    @keyframes fadeSlide {
      from { opacity: 0; transform: translateY(4px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    /* ── RESPONSIVE ── */
    @media (max-width: 600px) {
      nav { padding: 1rem 1.25rem; }
      .landing-header { padding: 36px 1.25rem 28px; }
      .themes-section { padding: 1.5rem 1.25rem 3rem; }
      #quiz-screen, #result-screen { padding: 6rem 1.1rem 2.5rem; }
      .q-dots { display: none; }
      .result-actions { flex-direction: column; align-items: center; }
    }
  </style>
</head>
<body>

  <div id="progress-line"></div>

  <nav>
    <a href="/" class="nav-logo">Talleres de <span>Teatro</span></a>
    <a href="/blog/" class="nav-back">← Lecturas</a>
  </nav>

  <!-- ══════════════════════════════════════
       ① LANDING
  ══════════════════════════════════════ -->
  <section id="landing-screen" class="screen">

    <div class="landing-header">
      <span class="landing-eyebrow">Talleres de Teatro · Barcelona</span>
      <h1 class="landing-title">TEATRO<br><em>CUESTIONARIO</em></h1>
      <div class="landing-meta">
        <p class="landing-desc">Elige un tema y pon a prueba lo que sabes.</p>
        <span class="landing-count"><strong>9</strong> temas · <strong>4</strong> preguntas cada uno</span>
      </div>
    </div>

    <div class="themes-section">
      <div class="themes-grid" id="themes-grid"></div>
    </div>

  </section>

  <!-- ══════════════════════════════════════
       ② QUIZ
  ══════════════════════════════════════ -->
  <section id="quiz-screen" class="screen">

    <div class="quiz-theme-bar">
      <button class="quiz-back-btn" id="quiz-back-btn">← Temas</button>
      <div class="quiz-divider"></div>
      <span class="quiz-theme-name" id="quiz-theme-name"></span>
    </div>

    <div class="q-inner" id="q-inner">
      <div class="q-header">
        <div class="q-counter">Pregunta <strong id="q-num">1</strong> de 4</div>
        <div class="q-dots" id="q-dots"></div>
      </div>
      <p class="q-tag" id="q-tag"></p>
      <h2 class="q-text" id="q-text"></h2>
      <div class="options" id="options-list"></div>
      <div class="hint-row">
        <button class="hint-btn" id="hint-btn" aria-expanded="false">▸ PISTA</button>
        <div class="hint-box" id="hint-box" role="note"></div>
      </div>
      <div class="feedback-box" id="feedback-box" role="status">
        <p class="feedback-label" id="feedback-label"></p>
        <p class="feedback-text" id="feedback-text"></p>
      </div>
      <button class="btn-next" id="next-btn">SIGUIENTE →</button>
      <p class="kbd-hint">Teclas 1 · 2 · 3 · 4 para elegir &nbsp;·&nbsp; Enter para continuar</p>
    </div>

  </section>

  <!-- ══════════════════════════════════════
       ③ RESULTADO
  ══════════════════════════════════════ -->
  <section id="result-screen" class="screen">
    <div class="result-inner">
      <span class="result-tema-label" id="result-tema-label"></span>
      <div class="score-block">
        <span class="score-num" id="result-score">0</span>
        <span class="score-denom"> / 4</span>
      </div>
      <div class="score-bar"><div class="score-bar-fill" id="score-bar-fill"></div></div>
      <p class="result-phrase" id="result-phrase"></p>
      <div class="result-actions">
        <a href="#" class="btn-primary" id="result-articulo-btn">LEER EL ARTÍCULO →</a>
        <button class="btn-secondary" id="result-retry-btn">REPETIR TEMA</button>
        <button class="btn-secondary" id="result-temas-btn">OTRO TEMA</button>
      </div>
    </div>
  </section>

  <script>
    /* ══════════════════════════════════════════════
       DATOS — 9 temas × 4 preguntas
    ══════════════════════════════════════════════ */
    const TEMAS = [

      /* 01 ─────────────────────────────────────── */
      {
        titulo:    "ACTUAR VS\nREPRESENTAR",
        subtitulo: "La diferencia que lo cambia todo",
        foto:      "actuacion-teatro-barcelona-0015.jpg",
        articulo:  "/blog/actuar-no-es-representar/",
        preguntas: [
          {
            tag: "Actuar no es representar",
            pregunta: "¿Cuál es la distinción principal entre 'representar' y 'actuar'?",

          {

          {

            pregunta: "En la improvisación dirigida, ¿qué se entiende por 'la situación'?",
            opciones: [

              "Los datos biográficos del personaje que el actor debe memorizar antes de entrar.",

            ],
            correcta: 1,
            pista: "¿Qué elementos concretos componen 'la situación'?",
            explicacion: "La situación no es el tema de la escena: son las circunstancias específicas que la hacen única. Quién está, dónde está, qué quiere, qué le impide obtenerlo. Esos datos son los que generan fricción real."

        ]
      },

      /* 09 ─────────────────────────────────────── */
      {

          {

          },
          {
            tag: "El juego como origen",
            pregunta: "¿Por qué el juego escénico no es gratuito ni ingenuo?",
            opciones: [
              "Porque el teatro profesional requiere rigor técnico y disciplina.",

            ],
            correcta: 1,
            pista: "¿Qué lleva encima el actor adulto que el niño no tiene?",
            explicacion: "El juego escénico no es inocente. Está cargado del peso del adulto: su deseo, sus obsesiones, su historia. Esa carga es lo que lo convierte en teatro y no en simple entretenimiento infantil."
          },
          {
            tag: "Habitar el presente",
            pregunta: "¿Cuál es el efecto más profundo del '¡dale que!' en el estado del actor?",
            opciones: [
              "Funciona como acuerdo técnico para indicar al compañero los desplazamientos en el espacio.",
              "Instala una fe escénica inmediata: el juego importa en serio y el cuerpo se entrega de verdad.",
              "Destruye toda limitación, habilitando una impunidad donde todo vale sin consecuencias.",
              "Obliga al actor a usar sus traumas personales para garantizar la organicidad del llanto."
            ],
            correcta: 1,
            pista: "¿Qué suspende el 'dale que' en la lógica cotidiana del actor?",
            explicacion: "El ¡dale que! suspende la lógica cotidiana para aceptar una nueva realidad momentánea. Al asumir esa creencia, el imaginario se enciende y el cuerpo deja de juzgarse desde fuera."
          }
        ]
      }

    ]; /* fin TEMAS */

    /* ══════════════════════════════════════
       STATE
    ══════════════════════════════════════ */
    let activeTema = null;
    let curQ = 0, score = 0, answered = false, hintOpen = false;

    /* ══════════════════════════════════════
       DOM
    ══════════════════════════════════════ */
    const $ = id => document.getElementById(id);
    const landingScreen  = $('landing-screen');
    const quizScreen     = $('quiz-screen');
    const resultScreen   = $('result-screen');
    const progressLine   = $('progress-line');
    const themesGrid     = $('themes-grid');
    const quizBackBtn    = $('quiz-back-btn');
    const quizThemeName  = $('quiz-theme-name');
    const qInner         = $('q-inner');
    const qNum           = $('q-num');
    const qDots          = $('q-dots');
    const qTag           = $('q-tag');
    const qText          = $('q-text');
    const optionsList    = $('options-list');
    const hintBtn        = $('hint-btn');
    const hintBox        = $('hint-box');
    const feedbackBox    = $('feedback-box');
    const feedbackLabel  = $('feedback-label');
    const feedbackText   = $('feedback-text');
    const nextBtn        = $('next-btn');
    const resultTemaLbl  = $('result-tema-label');
    const resultScore    = $('result-score');
    const scoreBarFill   = $('score-bar-fill');
    const resultPhrase   = $('result-phrase');
    const resultArtBtn   = $('result-articulo-btn');
    const resultRetryBtn = $('result-retry-btn');
    const resultTemasBtn = $('result-temas-btn');

    const BASE = 'https://talleresdeteatro.es/imagenes_optimizadas/';

    /* ══════════════════════════════════════
       SCREEN TRANSITIONS
    ══════════════════════════════════════ */
    function showScreen(el) {
      [landingScreen, quizScreen, resultScreen].forEach(s => {
        s.classList.remove('visible');
        s.style.display = 'none';
      });
      el.style.display = 'flex';
      el.offsetHeight;
      requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('visible')));
    }

    /* ══════════════════════════════════════
       BUILD LANDING
    ══════════════════════════════════════ */
    function buildLanding() {
      themesGrid.innerHTML = '';
      TEMAS.forEach((tema, i) => {
        const card = document.createElement('div');
        card.className = 'theme-card';
        card.setAttribute('role', 'button');
        card.setAttribute('tabindex', '0');
        card.setAttribute('aria-label', `Tema: ${tema.titulo.replace('\n', ' ')}`);
        card.innerHTML = `
          <img class="theme-card-img" src="${BASE}${tema.foto}" alt="${tema.titulo.replace('\n', ' ')}" loading="${i < 3 ? 'eager' : 'lazy'}" />
          <div class="theme-card-overlay"></div>
          <div class="theme-card-content">
            <div class="theme-card-top">
              <span class="theme-num">0${i + 1}</span>
              <span class="theme-badge">4 preguntas</span>
            </div>
            <div class="theme-card-bottom">
              <h2 class="theme-card-title">${tema.titulo.replace('\n', '<br>')}</h2>
              <p class="theme-card-sub">${tema.subtitulo}</p>
              <span class="theme-card-arrow">COMENZAR →</span>
            </div>
          </div>`;
        card.addEventListener('click', () => startTema(i));
        card.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') startTema(i); });
        themesGrid.appendChild(card);
      });
    }

    /* ══════════════════════════════════════
       START TEMA
    ══════════════════════════════════════ */
    function startTema(idx) {
      activeTema = TEMAS[idx];
      curQ = 0; score = 0; answered = false; hintOpen = false;
      quizThemeName.textContent = activeTema.titulo.replace('\n', ' ');
      progressLine.style.width = '0%';
      loadQuestion(0);
      showScreen(quizScreen);
    }

    /* ══════════════════════════════════════
       BUILD DOTS
    ══════════════════════════════════════ */
    function buildDots() {
      qDots.innerHTML = '';
      activeTema.preguntas.forEach((_, i) => {
        const d = document.createElement('div');
        d.className = 'q-dot' + (i < curQ ? ' done' : i === curQ ? ' current' : '');
        qDots.appendChild(d);
      });
    }

    /* ══════════════════════════════════════
       LOAD QUESTION
    ══════════════════════════════════════ */
    function loadQuestion(idx) {
      answered = false; hintOpen = false;
      const q = activeTema.preguntas[idx];

      qNum.textContent = idx + 1;
      buildDots();
      progressLine.style.width = (idx / activeTema.preguntas.length * 100) + '%';
      qTag.textContent  = q.tag;
      qText.textContent = q.pregunta;

      optionsList.innerHTML = '';
      ['A','B','C','D'].forEach((ltr, i) => {
        const opt = document.createElement('div');
        opt.className = 'option';
        opt.setAttribute('role', 'button');
        opt.setAttribute('tabindex', '0');
        opt.innerHTML = `
          <span class="opt-letter">${ltr}</span>
          <span class="opt-text">${q.opciones[i]}</span>
          <span class="opt-icon" aria-hidden="true"></span>`;
        opt.addEventListener('click', () => pick(i));
        opt.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') pick(i); });
        optionsList.appendChild(opt);
      });

      hintBox.textContent = q.pista;
      hintBox.classList.remove('open');
      hintBtn.textContent = '▸ PISTA';
      hintBtn.setAttribute('aria-expanded', 'false');

      feedbackBox.classList.remove('open');
      feedbackLabel.textContent = '';
      feedbackText.textContent  = '';
      feedbackLabel.classList.remove('wrong-lbl');

      nextBtn.classList.remove('show', 'visible');
    }

    /* ══════════════════════════════════════
       PICK
    ══════════════════════════════════════ */
    function pick(idx) {
      if (answered) return;
      answered = true;
      const q    = activeTema.preguntas[curQ];
      const opts = optionsList.querySelectorAll('.option');
      opts.forEach(o => o.classList.add('disabled'));

      if (idx === q.correcta) {
        score++;
        opts[idx].classList.add('correct');
        opts[idx].querySelector('.opt-icon').textContent = '✓';
        feedbackLabel.textContent = 'Correcto';
      } else {
        opts[idx].classList.add('wrong');
        opts[idx].querySelector('.opt-icon').textContent = '✗';
        opts[q.correcta].classList.add('reveal');
        feedbackLabel.textContent = 'No exactamente';
        feedbackLabel.classList.add('wrong-lbl');
      }

      feedbackText.textContent = q.explicacion;
      feedbackBox.classList.add('open');

      nextBtn.textContent = curQ === activeTema.preguntas.length - 1 ? 'VER RESULTADO →' : 'SIGUIENTE →';
      nextBtn.classList.add('show');
      requestAnimationFrame(() => requestAnimationFrame(() => nextBtn.classList.add('visible')));
    }

    /* ══════════════════════════════════════
       ADVANCE
    ══════════════════════════════════════ */
    function advance() {
      curQ++;
      if (curQ >= activeTema.preguntas.length) { showResult(); return; }
      qInner.style.opacity = '0';
      qInner.style.transform = 'translateY(-10px)';
      qInner.style.transition = 'opacity 0.22s ease, transform 0.22s ease';
      setTimeout(() => {
        loadQuestion(curQ);
        qInner.style.transition = 'opacity 0.3s ease, transform 0.3s ease';
        requestAnimationFrame(() => requestAnimationFrame(() => {
          qInner.style.opacity = '1';
          qInner.style.transform = 'translateY(0)';
        }));
      }, 240);
    }

    /* ══════════════════════════════════════
       RESULT
    ══════════════════════════════════════ */
    function showResult() {
      progressLine.style.width = '100%';
      resultTemaLbl.textContent = activeTema.titulo.replace('\n', ' ');
      resultScore.textContent   = score;
      resultArtBtn.href         = activeTema.articulo;

      const phrases = [
        { min: 4, text: "Lo tienes claro. Ahora llévalo al cuerpo." },
        { min: 3, text: "Casi todo. Vuelve a la pregunta que dudaste." },
        { min: 2, text: "Vale la pena leer el artículo de nuevo." },
        { min: 0, text: "El teatro empieza donde terminan las certezas." }
      ];
      resultPhrase.textContent = phrases.find(p => score >= p.min).text;

      showScreen(resultScreen);
      setTimeout(() => { scoreBarFill.style.width = (score / activeTema.preguntas.length * 100) + '%'; }, 100);
    }

    /* ══════════════════════════════════════
       HINT / KEYBOARD / EVENTS
    ══════════════════════════════════════ */
    hintBtn.addEventListener('click', () => {
      hintOpen = !hintOpen;
      hintBox.classList.toggle('open', hintOpen);
      hintBtn.textContent = hintOpen ? '▾ PISTA' : '▸ PISTA';
      hintBtn.setAttribute('aria-expanded', String(hintOpen));
    });

    document.addEventListener('keydown', e => {
      if (!quizScreen.classList.contains('visible')) return;
      const map = { '1': 0, '2': 1, '3': 2, '4': 3 };
      if (map[e.key] !== undefined && !answered) pick(map[e.key]);
      if ((e.key === 'Enter' || e.key === 'ArrowRight') && answered) advance();
    });

    quizBackBtn.addEventListener('click', () => { progressLine.style.width = '0%'; showScreen(landingScreen); });
    nextBtn.addEventListener('click', advance);
    resultRetryBtn.addEventListener('click', () => startTema(TEMAS.indexOf(activeTema)));
    resultTemasBtn.addEventListener('click', () => {
      progressLine.style.width = '0%';
      scoreBarFill.style.width = '0%';
      showScreen(landingScreen);
    });

    /* ══════════════════════════════════════
       INIT
    ══════════════════════════════════════ */
    buildLanding();
    landingScreen.style.display = 'flex';
    landingScreen.offsetHeight;
    requestAnimationFrame(() => requestAnimationFrame(() => landingScreen.classList.add('visible')));
  </script>
</body>
</html>
